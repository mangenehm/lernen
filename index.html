<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lernspiele</title>
  <style>
    :root {
      --bg: #f5f6f8; --surface: #ffffff; --border: #e1e4ea; --text: #23262d; --muted: #6b7180;
      --shadow: 0 6px 20px rgba(30, 40, 60, .08);
      --erdmaennchen: #e07a1f; --erdmaennchen-soft: #fdf0e3;
      --hasen: #d9568a; --hasen-soft: #fcebf2;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16181d; --surface: #20232a; --border: #323641; --text: #eceef2; --muted: #a2a8b6;
        --shadow: 0 6px 20px rgba(0, 0, 0, .35);
        --erdmaennchen: #f29a4a; --erdmaennchen-soft: #3a2a1c;
        --hasen: #ef86b0; --hasen-soft: #3a2230;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: clamp(1.8rem, 7vw, 2.6rem); }
    .sub { color: var(--muted); margin: 0 0 28px; }
    section { margin-bottom: 32px; }
    section > h2 {
      display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 1.35rem;
    }
    section > h2 .badge {
      display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px;
      background: var(--soft); font-size: 1.3rem;
    }
    #erdmaennchenklasse { --accent: var(--erdmaennchen); --soft: var(--erdmaennchen-soft); }
    #hasenklasse { --accent: var(--hasen); --soft: var(--hasen-soft); }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .card {
      display: flex; gap: 14px; align-items: center; text-decoration: none; color: inherit;
      background: var(--surface); border: 2px solid var(--border); border-left: 6px solid var(--accent);
      border-radius: 18px; padding: 16px; box-shadow: var(--shadow); transition: transform .1s ease;
    }
    a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
    .card svg { width: 54px; height: 92px; flex: none; }
    .card h3 { margin: 0 0 4px; font-size: 1.2rem; }
    .card p { margin: 0; color: var(--muted); font-size: .95rem; }
    .card.soon { box-shadow: none; border-style: dashed; border-left-style: solid; }
    .card.soon .icon { font-size: 2.4rem; width: 54px; text-align: center; flex: none; }
  </style>
</head>
<body>
<main>
  <h1>Lernspiele</h1>
  <p class="sub">Kleine Spiele zum Üben – sortiert nach Klasse.</p>

  <section id="erdmaennchenklasse">
    <h2><span class="badge" aria-hidden="true">🌵</span>Erdmännchenklasse</h2>
    <div class="grid">
      <a class="card" href="erdmaennchenklasse/wache/">
        <svg viewBox="0 -12 60 112" aria-hidden="true">
          <path d="M42 82 Q57 80 54 98" stroke="#8a5f36" stroke-width="5" fill="none" stroke-linecap="round"/>
          <ellipse cx="30" cy="66" rx="15" ry="27" fill="#c8965f"/>
          <ellipse cx="30" cy="70" rx="8.5" ry="19" fill="#efd6ab"/>
          <ellipse cx="22" cy="52" rx="4" ry="9" transform="rotate(28 22 52)" fill="#b8834f"/>
          <ellipse cx="38" cy="52" rx="4" ry="9" transform="rotate(-28 38 52)" fill="#b8834f"/>
          <ellipse cx="22" cy="94" rx="7" ry="3.5" fill="#8a5f36"/>
          <ellipse cx="38" cy="94" rx="7" ry="3.5" fill="#8a5f36"/>
          <circle cx="17.5" cy="22" r="3.4" fill="#5a3d22"/>
          <circle cx="42.5" cy="22" r="3.4" fill="#5a3d22"/>
          <ellipse cx="30" cy="26" rx="13" ry="14" fill="#c8965f"/>
          <ellipse cx="30" cy="34" rx="7.5" ry="6.5" fill="#e6c594"/>
          <ellipse cx="24" cy="24" rx="4" ry="5" fill="#3b2614"/>
          <ellipse cx="36" cy="24" rx="4" ry="5" fill="#3b2614"/>
          <circle cx="24.7" cy="22.8" r="1.2" fill="#fff"/>
          <circle cx="36.7" cy="22.8" r="1.2" fill="#fff"/>
          <ellipse cx="30" cy="32.5" rx="2.6" ry="1.9" fill="#2a1a0d"/>
          <path d="M27 37 Q30 39.5 33 37" stroke="#5a3d22" stroke-width="1.3" fill="none" stroke-linecap="round"/>
          <path d="M20 15 L30 -9 L40 15 Z" fill="#e4572e"/><circle cx="30" cy="-9" r="3" fill="#ffd23f"/>
        </svg>
        <div>
          <h3>Erdmännchen-Wache</h3>
          <p>Plus und Minus bis 100, Einmaleins und Einsdurcheins – mit Vorlesen und Spracheingabe.</p>
        </div>
      </a>
    </div>
  </section>

  <section id="hasenklasse">
    <h2><span class="badge" aria-hidden="true">🐰</span>Hasenklasse</h2>
    <div class="grid">
      <div class="card soon">
        <span class="icon" aria-hidden="true">🥕</span>
        <div>
          <h3>Bald geht's los</h3>
          <p>Hier kommen demnächst Spiele für die Hasenklasse.</p>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
