<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lernspiele</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#fbf3e2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1f1914" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Erdmännchen" />
  <script src="/assets/pwa.js" defer></script>
  <link rel="stylesheet" href="assets/base.css" />
  <style>
    :root {
      --erdmaennchen: #e07a1f; --erdmaennchen-soft: #fdf0e3;
      --hasen: #d9568a; --hasen-soft: #fcebf2;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #1f1914; --paper-2: #2b231b; --paper-3: #362c22;
        --ink: #f1e4cc; --ink-soft: #c2ad8f; --rule: #4a3d30;
        --erdmaennchen-soft: #3a2a1c; --hasen-soft: #3a2230;
      }
    }
    main { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }

    .kopf { margin-bottom: 26px; }
    .kopf img { display: block; width: 100%; height: auto; border-radius: var(--radius); box-shadow: var(--offset); }
    .kopf h1 { margin: 18px 0 2px; font-size: clamp(2rem, 8vw, 3rem); font-weight: 700; }
    .kopf p { margin: 0; color: var(--ink-soft); font-size: 1.08rem; }

    /* Jede Klasse ist ein „Heft“ mit farbigem Rücken */
    .heft {
      position: relative; margin-bottom: 26px; padding: 18px 18px 20px 38px;
      background: var(--paper-2); border: var(--line); border-radius: var(--radius); box-shadow: var(--offset);
    }
    .heft::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 18px;
      background: var(--accent); border-right: var(--line); border-radius: 10px 0 0 10px;
    }
    .heft::after {   /* Heftklammern */
      content: ""; position: absolute; left: 6px; top: 22%; width: 6px; height: 56%;
      background: linear-gradient(var(--ink) 0 14px, transparent 14px calc(100% - 14px), var(--ink) calc(100% - 14px));
      border-radius: 3px; opacity: .55;
    }
    #erdmaennchenklasse { --accent: var(--erdmaennchen); --soft: var(--erdmaennchen-soft); }
    #hasenklasse { --accent: var(--hasen); --soft: var(--hasen-soft); }
    .heft h2 { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; font-size: 1.5rem; }
    .heft h2 img { width: 56px; height: 56px; flex: none; }

    .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .karte {
      display: block; text-decoration: none; color: inherit; overflow: hidden;
      background: var(--paper-2); border: var(--line); border-radius: var(--radius); box-shadow: var(--offset);
      transition: transform .08s ease, box-shadow .08s ease;
    }
    a.karte:hover, a.karte:focus-visible { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); outline: none; }
    a.karte:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .karte img { display: block; width: 100%; height: auto; aspect-ratio: 8 / 5; border-bottom: var(--line); background: var(--soft); }
    .karte .text { padding: 12px 14px 14px; }
    .karte h3 { margin: 0 0 4px; font-size: 1.3rem; }
    .karte p { margin: 0; color: var(--ink-soft); font-weight: 700; font-size: .95rem; }

    /* Platzhalter als Bleistift-Skizze */
    .karte.bald {
      background: transparent; box-shadow: none; border: 2px dashed var(--ink-soft);
      display: flex; align-items: center; gap: 14px; padding: 16px; min-height: 120px;
    }
    .karte.bald svg { width: 64px; height: 64px; flex: none; color: var(--ink-soft); }
    .karte.bald h3 { font-weight: 500; }
    .karte.bald p { font-weight: 400; }
  </style>
</head>
<body>
<main>
  <header class="kopf">
    <img src="assets/art/header.svg" width="800" height="300" alt="Erdmännchen stehen in der Savanne neben einem Rechenheft" />
    <h1>Lernspiele</h1>
    <p>Kleine Spiele zum Üben – sortiert nach Klasse.</p>
  </header>

  <section class="heft" id="erdmaennchenklasse">
    <h2><img src="assets/art/klasse-erdmaennchen.svg" alt="" width="56" height="56" />Erdmännchenklasse</h2>
    <div class="grid">
      <a class="karte" href="erdmaennchenklasse/guten-morgen/">
        <img src="assets/art/karte-wache.svg" alt="" width="320" height="200" />
        <div class="text">
          <h3>Guten Morgen, Erdmännchen!</h3>
          <p>Rechnen · Vorlesen · Sprechen</p>
        </div>
      </a>
    </div>
  </section>

  <section class="heft" id="hasenklasse">
    <h2><img src="assets/art/klasse-hasen.svg" alt="" width="56" height="56" />Hasenklasse</h2>
    <div class="grid">
      <div class="karte bald">
        <svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 3">
          <path d="M22 26 L42 26 L32 60 Z"/><path d="M27 34 h6 M29 42 h5"/>
          <path d="M32 26 Q26 14 20 10 M32 26 Q32 12 34 6 M32 26 Q38 14 46 12" stroke-dasharray="none"/>
        </svg>
        <div>
          <h3>Bald geht's los</h3>
          <p>Hier kommen demnächst Spiele für die Hasenklasse.</p>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
